aid: odyssey-ai
name: Odyssey Ai
description: >-
  Odyssey is an AI research lab building general-purpose world models — causal,
  multimodal systems that understand and simulate physical environments, generating
  long-form interactive video simulations from text or image prompts rather than text.
  Its research includes Odyssey-2 (a flagship world model producing multi-minute
  interactive simulations), Starchild-1 (a real-time multimodal world model), Agora-1
  (a multi-agent world simulator), and PROWL-1 (a reinforcement-learning framework for
  adversarial environment exploration). Odyssey positions world models as foundational
  AI for robotics, gaming, healthcare, education, and 3D visual asset generation, and
  raised a $310M Series B. The company is a portfolio company of DCVC. At the time of
  this profile Odyssey publishes research, writing, and interactive demos but exposes
  no public developer API, SDK, or documentation surface.
